<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Formulario - Examen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #f8f9fa;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #a0a4a8;
        }

        .campo-valido {
            border-color: #10b981 !important;
            background-color: #f0fdf4 !important;
        }

        .campo-invalido {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
        }

        .error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
            display: block;
            font-weight: 500;
        }

        .campo-obligatorio::after {
            content: " *";
            color: #ef4444;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .mensaje-exito {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
            white-space: pre-line;
            line-height: 1.6;
        }

        .icono-estado {
            position: absolute;
            right: 15px;
            top: 40px;
            font-size: 18px;
        }

        .icono-valido {
            color: #10b981;
        }

        .icono-invalido {
            color: #ef4444;
        }

        .info-campo {
            font-size: 11px;
            color: #6b7280;
            margin-top: 3px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Formulario de Contacto</h1>
        <form id="formulario-contacto">
            <div class="form-group">
                <label for="nombre" class="campo-obligatorio">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Ingrese su nombre completo">
                <span id="error-nombre" class="error"></span>
            </div>
            
            <div class="form-group">
                <label for="email" class="campo-obligatorio">Email</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com">
                <span id="error-email" class="error"></span>
                <div class="info-campo">Debe contener el símbolo @</div>
            </div>
            
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" placeholder="Opcional - mínimo 8 dígitos">
                <span id="error-telefono" class="error"></span>
                <div class="info-campo">Campo opcional - si completa, mínimo 8 dígitos</div>
            </div>
            
            <button type="submit">Enviar Formulario</button>
        </form>
        <div id="mensaje-exito"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
